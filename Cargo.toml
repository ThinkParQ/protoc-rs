[package]
name = "protoc-rs"
version = "0.6.0"
edition = "2021"

authors = ["ThinkParQ GmbH"]
homepage = "https://github.com/thinkparq/protoc-rs"
description = "Protobuf Rust compiler, based on tonic-build"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"]}
